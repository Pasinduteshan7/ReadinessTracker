# Production profile for Supabase Free Tier Optimization
# Use minimal connections and aggressive timeouts

spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=ReadinessProdPool
spring.datasource.hikari.register-mbeans=false

# Disable all Hibernate metadata queries
spring.jpa.properties.hibernate.boot=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=10

# Disable all DDL on startup
spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Connection pooler settings
spring.jpa.properties.hibernate.connection.provider_class=org.hibernate.hikaricp.internal.HikariCPConnectionProvider

logging.level.org.hibernate.engine.transaction.internal.TransactionImpl=WARN
logging.level.org.hibernate.engine.jdbc.internal.LoggerFactory=WARN
