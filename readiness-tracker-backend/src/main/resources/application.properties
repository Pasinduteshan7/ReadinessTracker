# HIKARI POOLING (Optimized for Supabase Free Tier PgBouncer)
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.statement-cache-size=250
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=55000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.register-mbeans=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.properties.hibernate.jdbc.use_streams_for_binary=true
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
server.port=8080

# JWT Configuration
jwt.secret=mySecretKeyForJWTTokenGenerationAndValidationPurpose12345678901234567890LONGER
jwt.expiration=86400000

# Async Configuration - SINGLE THREAD ONLY for Supabase stability
spring.task.execution.pool.core-size=0
spring.task.execution.pool.max-size=1
spring.task.execution.pool.queue-capacity=10
spring.task.execution.thread-name-prefix=readiness-async-
spring.task.scheduling.thread-name-prefix=readiness-scheduler-
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=10s
spring.task.scheduling.pool.size=0
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=5s

# GitHub API Configuration
github.token=

# AI Engine Bridge Configuration
ai.engine.url=http://localhost:8000
ai.engine.analyze.fetch-repos=/api/analyze/fetch-repos
ai.engine.analyze.quality=/api/analyze/quality
ai.engine.analyze.ai-detection=/api/analyze/ai-detection
ai.engine.score.neural-network=/api/score/neural-network
ai.engine.connect-timeout=10000
ai.engine.read-timeout=30000

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.readinesstrackerbackend=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# BENCHMARKING CONFIGURATION - DISABLED FOR SUPABASE STABILITY
benchmark.auto-verify=false
benchmark.auto-calibrate=false
batch.auto-analyze=false
batch.auto-initialize=false
analysis.auto-cache-refresh=false

# Flyway Configuration - DISABLED
spring.flyway.enabled=false
spring.flyway.baselineOnMigrate=false

# CACHING - MEMORY CACHE FOR FREQUENT QUERIES
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=1h

# SERVER SETTINGS
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=5
